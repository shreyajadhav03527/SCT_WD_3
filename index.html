<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Quiz Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
body{
    background:linear-gradient(135deg,#4facfe,#6a5acd);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.quiz-box{
    width:100%;
    max-width:700px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}
h1{
    text-align:center;
    color:#5b3df5;
    margin-bottom:20px;
}
.progress{
    height:12px;
    background:#ddd;
    border-radius:30px;
    overflow:hidden;
    margin-bottom:20px;
}
.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00c6ff,#6a5acd);
    transition:.4s;
}
.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    color:#555;
    font-weight:bold;
}
#question{
    color:#222;
    margin-bottom:18px;
}
.option{
    display:block;
    background:#f3f4f6;
    margin:10px 0;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}
.option:hover{
    background:#dfe8ff;
}
.option input{
    margin-right:10px;
}
input[type=text]{
    width:100%;
    padding:14px;
    border:2px solid #ccc;
    border-radius:10px;
    font-size:16px;
}
button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#5b3df5;
    color:#fff;
    font-size:17px;
    cursor:pointer;
}
button:hover{
    background:#4526dd;
}
#result{
    display:none;
    text-align:center;
}
.score{
    font-size:45px;
    color:#28a745;
    margin:15px 0;
}
.percentage{
    font-size:22px;
    color:#444;
}
</style>
</head>

<body>

<div class="quiz-box">

<h1>🎯 Interactive Quiz Game</h1>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div class="info">
<span id="qNo"></span>
<span id="type"></span>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<button id="nextBtn">Next Question</button>

<div id="result">
<h2>🎉 Quiz Completed!</h2>
<div class="score" id="scoreText"></div>
<div class="percentage" id="percentText"></div>
<button onclick="restartQuiz()">Restart Quiz</button>
</div>

</div>

<script>

const quiz=[

{
type:"single",
question:"1. Which language is used for styling web pages?",
options:["HTML","CSS","Python","Java"],
answer:"CSS"
},

{
type:"multi",
question:"2. Which of the following are JavaScript frameworks?",
options:["React","Laravel","Vue","Angular"],
answer:["React","Vue","Angular"]
},

{
type:"fill",
question:"3. Fill in the blank: HTML stands for ________.",
answer:"Hyper Text Markup Language"
},

{
type:"single",
question:"4. Which company developed JavaScript?",
options:["Microsoft","Netscape","Google","Apple"],
answer:"Netscape"
},

{
type:"multi",
question:"5. Select all database systems.",
options:["MySQL","MongoDB","Photoshop","PostgreSQL"],
answer:["MySQL","MongoDB","PostgreSQL"]
},

{
type:"fill",
question:"6. CSS means ______ Style Sheets.",
answer:"Cascading"
},

{
  type: "single",
  question: "7. Which HTML element is used to insert an image into a webpage?",
  options: ["img", "picture", "image", "src"],
  answer: "img"
},

{
type:"single",
question:"8. Which symbol is used for single-line comments in JavaScript?",
options:["//","!-- --","##","**"],
answer:"//"
},

{
type:"multi",
question:"9. Which are programming languages?",
options:["Python","Java","HTML","C++"],
answer:["Python","Java","C++"]
},

{
type:"fill",
question:"10. The brain of the computer is called the ______.",
answer:"CPU"
},

{
type:"single",
question:"11. Which CSS property changes text color?",
options:["font-color","text-color","color","background"],
answer:"color"
},

{
type:"multi",
question:"12. Which are semantic HTML tags?",
options:["header","footer","section","style"],
answer:["header","footer","section"]
},

{
type:"single",
question:"13. Which SQL command retrieves data?",
options:["INSERT","UPDATE","SELECT","DELETE"],
answer:"SELECT"
},

{
type:"fill",
question:"14. JavaScript files use the extension ______.",
answer:".js"
},

{
type:"single",
question:"15. Which data structure follows LIFO?",
options:["Queue","Stack","Array","Tree"],
answer:"Stack"
}

];

let current=0;
let score=0;

const question=document.getElementById("question");
const answers=document.getElementById("answers");
const qNo=document.getElementById("qNo");
const type=document.getElementById("type");
const bar=document.getElementById("bar");
const nextBtn=document.getElementById("nextBtn");

function loadQuestion(){

const q=quiz[current];

qNo.innerText=`Question ${current+1} of ${quiz.length}`;

type.innerText=q.type==="single"?"Single Select":
q.type==="multi"?"Multi Select":"Fill in the Blank";

question.innerText=q.question;

bar.style.width=(current/quiz.length)*100+"%";

answers.innerHTML="";

if(q.type==="single"){

q.options.forEach(opt=>{

answers.innerHTML+=`
<label class="option">
<input type="radio" name="ans" value="${opt}">
${opt}
</label>`;

});

}

if(q.type==="multi"){

q.options.forEach(opt=>{

answers.innerHTML+=`
<label class="option">
<input type="checkbox" value="${opt}">
${opt}
</label>`;

});

}

if(q.type==="fill"){

answers.innerHTML=`
<input type="text" id="fill" placeholder="Type your answer">`;

}

}

function checkAnswer(){

const q=quiz[current];

if(q.type==="single"){

const selected=document.querySelector("input[name='ans']:checked");

if(selected && selected.value===q.answer)
score++;

}

if(q.type==="multi"){

const checked=[...document.querySelectorAll("input[type='checkbox']:checked")]
.map(i=>i.value).sort();

const correct=[...q.answer].sort();

if(JSON.stringify(checked)===JSON.stringify(correct))
score++;

}

if(q.type==="fill"){

const value=document.getElementById("fill").value.trim().toLowerCase();

if(value===q.answer.toLowerCase())
score++;

}

}

nextBtn.addEventListener("click",()=>{

checkAnswer();

current++;

if(current<quiz.length){

loadQuestion();

}else{

showResult();

}

});

function showResult(){

question.style.display="none";
answers.style.display="none";
nextBtn.style.display="none";
qNo.style.display="none";
type.style.display="none";

document.getElementById("result").style.display="block";

bar.style.width="100%";

let percent=Math.round((score/quiz.length)*100);

document.getElementById("scoreText").innerHTML=`${score} / ${quiz.length}`;
document.getElementById("percentText").innerHTML=`Percentage: ${percent}%`;

}

function restartQuiz(){

current=0;
score=0;

question.style.display="block";
answers.style.display="block";
nextBtn.style.display="block";
qNo.style.display="inline";
type.style.display="inline";

document.getElementById("result").style.display="none";

loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
